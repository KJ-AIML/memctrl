name: Release

# Pull requests build and smoke-test every release target, then collect and check the archives
# the way a release does, without publishing anything. Pushing a `vX.Y.Z` tag builds the same
# artifacts and creates a *draft* GitHub release with SHA256SUMS; a maintainer reviews the draft
# and publishes it by hand.
on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main, master]
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "install.sh"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.target }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, run: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, run: true }
          - { target: aarch64-apple-darwin, os: macos-latest, run: true }
          # Cross-compiled on Apple silicon; Rosetta is not guaranteed, so it is not executed.
          - { target: x86_64-apple-darwin, os: macos-latest, run: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, run: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --bin memctrl --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.run
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/memctrl"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --version
          db="$RUNNER_TEMP/smoke.db"
          "$bin" --db "$db" add "Release smoke: we use SQLite" --layer project
          "$bin" --db "$db" query "SQLite" | grep -q "Release smoke"
      - name: Package
        shell: bash
        run: |
          name="memctrl-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp README.md LICENSE MIGRATION.md "dist/$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/memctrl.exe" "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
          else
            cp "target/${{ matrix.target }}/release/memctrl" "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          rm -rf "dist/$name"
          ls -l dist
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: memctrl-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Runs on pull requests too, so a change in how artifacts download shows up before a tag.
  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # used only by the tag-only release step
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Tag must match the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "${GITHUB_REF_NAME#v}" = "$crate" || { echo "tag $GITHUB_REF_NAME != Cargo.toml $crate"; exit 1; }
      - uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Check the archives
        run: |
          export LC_ALL=C
          expected=$(printf '%s\n' \
            memctrl-aarch64-apple-darwin.tar.gz \
            memctrl-aarch64-unknown-linux-musl.tar.gz \
            memctrl-x86_64-apple-darwin.tar.gz \
            memctrl-x86_64-pc-windows-msvc.zip \
            memctrl-x86_64-unknown-linux-musl.tar.gz)
          actual=$(ls dist | sort)
          if [ "$actual" != "$expected" ]; then
            printf 'dist should hold exactly:\n%s\nbut holds:\n%s\n' "$expected" "$actual"
            exit 1
          fi
          for archive in dist/*.tar.gz; do
            name=$(basename "$archive" .tar.gz)
            tar -tzf "$archive" | grep -qx "$name/memctrl" || { echo "$archive has no $name/memctrl"; exit 1; }
          done
          unzip -l dist/memctrl-x86_64-pc-windows-msvc.zip | grep -q 'memctrl\.exe$' \
            || { echo "the Windows zip has no memctrl.exe"; exit 1; }
      - name: Checksums
        run: cd dist && sha256sum memctrl-* > SHA256SUMS && cat SHA256SUMS
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft --verify-tag \
            --title "MemCtrl $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
