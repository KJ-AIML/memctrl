name: Rust CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release --bin memctrl --examples
  native-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require Rust-only source and packaging
        shell: bash
        run: |
          if git ls-files '*.py' '*.pyc' 'pyproject.toml' 'requirements*.txt' 'uv.lock' | grep -q .; then
            echo 'Python source or packaging found'
            exit 1
          fi
