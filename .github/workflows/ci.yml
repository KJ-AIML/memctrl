name: Rust CI
on:
  push:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "MIGRATION.md"
      - "RELEASE_NOTES.md"
      - "DISTRIBUTION.md"
      - "RUST-RESEARCH.md"
      - "AGENTS.md"
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "MIGRATION.md"
      - "RELEASE_NOTES.md"
      - "DISTRIBUTION.md"
      - "RUST-RESEARCH.md"
      - "AGENTS.md"
permissions:
  contents: read
# A newer commit on the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    # Drafts skip the 3-OS matrix; marking the PR ready triggers it (ready_for_review).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release --bin memctrl --examples
  native-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require Rust-only source and packaging
        shell: bash
        run: |
          if git ls-files '*.py' '*.pyc' 'pyproject.toml' 'requirements*.txt' 'uv.lock' | grep -q .; then
            echo 'Python source or packaging found'
            exit 1
          fi
