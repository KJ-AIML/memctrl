<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="t d" xml:space="preserve">
  <title id="t">memctrl session brief</title>
  <desc id="d">The brief Claude Code receives at session start: one decision, one convention, and one memory under "Check before trusting" because the line it cites in src/db.rs changed.</desc>
