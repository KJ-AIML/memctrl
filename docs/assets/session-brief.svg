  <circle cx="26" cy="23" r="4" fill="#8b5cf6"/>
  <text class="bar" x="40" y="27.5">Claude Code · SessionStart hook</text>
  <text class="cmd" x="936" y="27.5" text-anchor="end">$ memctrl context</text>

  <text class="h1" x="40" y="86"># Project memory (memctrl)</text>
  <text class="meta" x="40" y="112">3 of 3 memories from project, user · ≈161 tokens · highest trust first.</text>

  <text class="h2" x="40" y="158">## Decisions</text>
  <text class="item" x="40" y="186">- We chose SQLx over Diesel: compile-time query checks caught 3 prod bugs<tspan class="id"> · 98afb738</tspan></text>

  <text class="h2" x="40" y="232">## Facts and conventions</text>
  <text class="item" x="40" y="260">- Run make ci before every push; it mirrors GitHub CI<tspan class="id"> · d5fd72be</tspan></text>

  <rect x="14" y="284" width="932" height="76" rx="9" fill="#f5b54a" fill-opacity="0.07" stroke="#f5b54a" stroke-opacity="0.24"/>
  <circle class="pulse" cx="24" cy="335" r="7" fill="#f5b54a" fill-opacity="0.22"/>
  <circle cx="24" cy="335" r="3.5" fill="#f5b54a"/>
  <text class="warn" x="40" y="312">## Check before trusting</text>
  <text class="item" x="40" y="340">- DB pool size is 16; raising it starves Postgres<tspan class="id"> · 26aec6f9 · </tspan><tspan class="stale">stale: src/db.rs changed</tspan></text>
